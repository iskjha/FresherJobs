name: Daily pipeline

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_PROFILE_MODEL: ${{ vars.OPENAI_PROFILE_MODEL }}
      PIPELINE_SOURCE_ALLOWLIST: ${{ vars.PIPELINE_SOURCE_ALLOWLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check required configuration
        run: |
          test -n "$MONGODB_URI" || { echo "MONGODB_URI secret is required"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is required"; exit 1; }
          test -n "$PIPELINE_SOURCE_ALLOWLIST" || { echo "PIPELINE_SOURCE_ALLOWLIST repository variable is required"; exit 1; }
      - run: npm run pipeline
